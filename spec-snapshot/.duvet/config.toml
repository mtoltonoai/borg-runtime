'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# =============================================================================
# Conformance gate: the map from each requirement to the code and the test
# that cite it.
#
# TWO HALVES, split by who owns them:
#
#   [[specification]]  - STABLE. Maintained by hand. One block per NORMATIVE
#                        file. This is the requirement side: the gate extracts
#                        every key-word sentence from these files.
#                        `format = "markdown"` is REQUIRED (the default format
#                        is for standards-track documents and extracts nothing
#                        from this prose). A requirement's identity is
#                        (file, section slug, quoted sentence); there are no
#                        invented IDs; editing a sentence flags every stale
#                        citation as a hard error. Paths are relative to the
#                        PROJECT ROOT (the parent of this .duvet/ directory).
#
#                        The normative files are of four kinds:
#                          - constitution.md: the invariants.
#                          - spec/contracts/*.md: the interfaces that
#                            independently deployed parties honor across
#                            versions.
#                          - spec/core/*.md: the behavior every valid solution
#                            has, under every outcome of every decision.
#                          - spec/decisions/<decision>/<outcome>.md: the
#                            requirements that apply only under one outcome of
#                            one decision or one fixed default. Every outcome
#                            file is listed below, grouped by decision and then
#                            by fixed default. Only the files of the outcomes
#                            the decision record adopts, and the files of the
#                            fixed defaults, are active; every other outcome
#                            file is present with a leading "# " on each line
#                            of its block. To change a selection, move the
#                            comment markers and update spec/record.md part A;
#                            spec/record.md part C states the rule, and
#                            spec/decisions/deferred.md states what reopens a
#                            fixed default.
#
#                        The descriptive files (spec/README.md, spec/overview.md,
#                        spec/glossary.md, spec/traceability.md, spec/record.md,
#                        the decision documents spec/decisions/*.md, and
#                        spec/decisions/README.md and deferred.md) carry no
#                        requirements and are intentionally omitted.
#
#   [[source]]         - the code side: the globs of the first-party code that
#                        cite the requirements. The platform's code lives under
#                        api/, components/, daemons/, and tools/. Generated code
#                        is excluded (it is not committed and nobody cites from
#                        it).
# =============================================================================

# ---- code side (the first-party code that carries citations) ----------------
[[source]]
pattern = "api/**/*.rs"

[[source]]
pattern = "components/**/*.rs"

[[source]]
pattern = "daemons/**/*.rs"

[[source]]
pattern = "tools/**/*.rs"

